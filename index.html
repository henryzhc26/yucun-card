<style>
  :root{
    --ink:#141225; --ink2:#4b4a63; --line:rgba(20,18,37,.10);
    --violet:#5b45e0; --violet2:#7c5cff; --bg:#f6f4ff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    min-height:100vh; background:
      radial-gradient(120% 80% at 50% -10%, #ded6ff 0%, rgba(246,244,255,0) 60%),
      radial-gradient(90% 60% at 90% 110%, #e6e0ff 0%, rgba(246,244,255,0) 55%),
      var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    display:flex; align-items:center; justify-content:center; padding:28px 20px calc(28px + env(safe-area-inset-bottom));
  }
  .wrap{width:100%;max-width:430px}
  .brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}
  .logo{
    width:46px;height:46px;border-radius:14px;flex:0 0 auto;
    background:linear-gradient(145deg,#6b53ea,#9b7bff);
    box-shadow:0 8px 20px rgba(91,69,224,.28);
    display:grid;place-items:center;color:#fff;font-weight:700;font-size:19px;letter-spacing:.5px;
  }
  .brand h1{font-size:15px;line-height:1.3;margin:0}
  .brand p{margin:2px 0 0;font-size:12px;color:var(--ink2);letter-spacing:.2px}
  .card{
    background:#fff;border:1px solid var(--line);border-radius:22px;
    padding:22px 20px 20px; box-shadow:0 18px 44px rgba(38,26,92,.10), 0 2px 6px rgba(38,26,92,.05);
  }
  .kicker{font-size:12px;font-weight:600;letter-spacing:.12em;color:var(--violet);margin:0 0 10px}
  .card h2{margin:0 0 8px;font-size:24px;line-height:1.25;letter-spacing:.2px}
  .card .sub{margin:0 0 18px;font-size:13.5px;line-height:1.6;color:var(--ink2)}
  .feats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 20px}
  .feats span{
    font-size:12.5px;color:#3b3554;background:#f5f2ff;border:1px solid #ece7ff;
    border-radius:11px;padding:9px 10px;text-align:center;
  }
  .btn{
    display:block;text-align:center;text-decoration:none;
    background:linear-gradient(140deg,var(--violet),var(--violet2));
    color:#fff;font-size:16px;font-weight:600;letter-spacing:.3px;
    padding:16px 18px;border-radius:15px;
    box-shadow:0 12px 26px rgba(91,69,224,.30);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .btn:active{transform:translateY(1px) scale(.995);box-shadow:0 8px 18px rgba(91,69,224,.26)}
  .hint{margin:12px 0 0;font-size:12px;line-height:1.65;color:#6c6a83;text-align:center}
  .note{
    margin-top:16px;background:#fffdf3;border:1px solid #f3e6bf;border-radius:14px;
    padding:12px 14px;font-size:12px;line-height:1.7;color:#6a5a2a;
  }
  .note b{color:#4d3f12}
  footer{margin-top:18px;text-align:center;font-size:11.5px;color:#8b8aa0;letter-spacing:.2px}
</style>

  <main class="wrap">

    <section class="card">

      <div class="feats">

        <span>收付款台账</span>
        <span>采购真实价</span>
        <span>对账与报表</span>
      </div>
      <a class="btn" href="http://Henrys-MacBook-Pro.local:8901/">进入宇存</a>
      <p class="hint">首次使用请点你收到的那条专属链接完成验证，之后一直都是打开就能看。</p>
    </section>

    <div class="note">
      <b>打不开？</b>宇存跑在公司这台 Mac 上，手机需要连公司同一个 WiFi；人在外面连不上是正常的。
    </div>

    <footer>仅供宇诚内部使用 · HIVISION INTERNATIONAL LIMITED</footer>
